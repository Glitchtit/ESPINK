# ESPINK — Home Assistant push automation (working reference).
#
# Drives the panel by publishing slot values to the Z2M device's `set` topic.
# IMPORTANT: send them in SMALL BATCHES with short delays, not all at once. A
# single ~20-attribute burst overflowed the ESP32-C6's 802.15.4 RX buffer pool
# and faulted the radio ISR; spreading the writes over a few seconds avoids it.
# The firmware coalesces writes with a 10 s quiet window (see zigbee.c
# COALESCE_US): it only repaints once no slot has changed for 10 s, so the whole
# push (5 batches x 900 ms + jitter) must land BEFORE that window elapses — the
# ~26 s refresh then runs once, on complete data, without blocking reception.
# Refreshes every 15 min (each 3-colour e-paper refresh is ~26s), on HA start,
# and ~30 s after the device announces itself on reboot/rejoin.
#
# Slot conventions (see main/display.c):
#   now_label / fc* : "icon:text" or "day:icon:HH/LL"; icons = sun, cloud, rain,
#                     storm, snow, fog, wind, partly, clear-night.
#   now_hilo        : today's "HH/LL"; a high >= 25 renders red (also on fc*).
#   sns3            : moon phase "state:Friendly" (state = sensor.moon_phase);
#                     firmware draws the lit disc + the name in the headache panel.
#   headache        : 0-100 index -> firmware picks the severity icon.
#   Any tile ending in a Celsius temp >= 25 (now_value, sns*) renders red.

automation:
  - alias: ESPINK dashboard push
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      # The device rebooted/rejoined (power loss, reflash, crash): Z2M publishes
      # a device_announce, and the panel may be blank after a power-on clear.
      - trigger: mqtt
        topic: zigbee2mqtt/bridge/event
        value_template: "{{ value_json.type ~ ':' ~ value_json.data.friendly_name }}"
        payload: "device_announce:ESPINK"
        id: device_announce
    variables:
      cond_map:
        sunny: sun
        clear-night: clear-night
        partlycloudy: partly
        cloudy: cloud
        rainy: rain
        pouring: rain
        hail: snow
        lightning: storm
        lightning-rainy: storm
        snowy: snow
        snowy-rainy: snow
        fog: fog
        windy: wind
        windy-variant: wind
        exceptional: cloud
    actions:
      # Let the boot-time panel clear (~26 s full refresh) finish first.
      - if:
          - condition: trigger
            id: device_announce
        then:
          - delay: {seconds: 30}
      - action: weather.get_forecasts
        target: {entity_id: weather.forecast_home}
        data: {type: daily}
        response_variable: fc
      - action: todo.get_items
        target: {entity_id: todo.storage_shopping_list}
        data: {status: needs_action}
        response_variable: shoplist
      - action: calendar.get_events
        target:
          entity_id: [calendar.thomas, calendar.chores, calendar.anniins, calendar.prakticum]
        data:
          start_date_time: "{{ today_at('00:00').isoformat() }}"
          end_date_time: "{{ (today_at('00:00') + timedelta(days=1)).isoformat() }}"
        response_variable: cal
      - variables:
          fdays: "{{ fc['weather.forecast_home'].forecast if (fc is defined and fc.get('weather.forecast_home')) else [] }}"
          shoplines: >-
            {% set names = (shoplist['todo.storage_shopping_list']['items'] | map(attribute='summary') | list) if (shoplist is defined and shoplist.get('todo.storage_shopping_list')) else [] %}
            {% set names = names | map('truncate', 42, true, '..', 0) | list %}
            {% set total = names | length %}
            {{ names if total <= 6 else names[:5] + ['And ' ~ (total - 5) ~ ' more items'] }}
          # DAILY AGENDA: merge today's events from several calendars, sort by
          # start, strip emoji (keep latin-1 so Finnish äöå survive), dedup, and
          # prefix timed events with HH:MM (all-day events show the title only).
          callines: >-
            {% set cals = ['calendar.thomas','calendar.chores','calendar.anniins','calendar.prakticum'] %}
            {% set ns = namespace(items=[]) %}
            {% for c in cals %}{% set ns.items = ns.items + (cal[c]['events'] if (cal is defined and cal.get(c)) else []) %}{% endfor %}
            {% set ev = ns.items | sort(attribute='start') %}
            {% set ns2 = namespace(lines=[]) %}
            {% for e in ev %}{% set summ = (e.summary | regex_replace('[^\x00-\xff]+','') | trim) %}{% set t = (as_timestamp(e.start) | timestamp_custom('%H:%M') ~ ' ') if 'T' in (e.start | string) else '' %}{% set ns2.lines = ns2.lines + [(t ~ summ) | truncate(30, true, '..', 0)] %}{% endfor %}
            {{ (ns2.lines | unique | list)[:4] }}
          # Header: red (leading '~' = RED_MARK) on holidays (Holiday integration
          # calendar 'on') and Sundays; append the holiday name on holidays.
          hdr: >-
            {% set hol = is_state('calendar.finland_11','on') %}
            {% set red = hol or now().weekday() == 6 %}
            {% set name = state_attr('calendar.finland_11','message') if hol else '' %}
            {{ ('~' if red else '') ~ now().strftime('%a %-d %b') ~ (' - ' ~ name if name else '') }}
      # Build one "day:icon:HH/LL" forecast string for offset d (1..3).
      - variables:
          b1: >-
            {{ {'hdr_left': hdr,
                'hdr_right': 'Updated ' ~ now().strftime('%H:%M'),
                'now_value': (state_attr('weather.forecast_home','temperature') | round | string) ~ '°C',
                'now_label': cond_map.get(states('weather.forecast_home'),'cloud') ~ ':' ~ (states('weather.forecast_home') | replace('-',' ') | title),
                'now_hilo': ((fdays[0].temperature | round | string) ~ '°/' ~ (fdays[0].get('templow', fdays[0].temperature) | round | string) ~ '°') if fdays | length > 0 else ''} }}
          b2: >-
            {% macro fc(d) -%}
            {%- if fdays | length > d -%}{%- set x = fdays[d] -%}{{ as_timestamp(x.datetime) | timestamp_custom('%a') }}:{{ cond_map.get(x.condition,'cloud') }}:{{ x.temperature | round }}°/{{ x.get('templow', x.temperature) | round }}°{%- endif -%}
            {%- endmacro -%}
            {{ {'fc1': fc(1), 'fc2': fc(2), 'fc3': fc(3),
                'sns1': 'Living room: ' ~ (states('sensor.lroom_sensor_temperature') | float(0) | round(1) | string) ~ '°C',
                'sns2': 'Humidity: ' ~ (states('sensor.lroom_sensor_humidity') | float(0) | round | string) ~ '%'} }}
          b3: >-
            {{ {'sns3': states('sensor.moon_phase') ~ ':' ~ (states('sensor.moon_phase') | replace('_',' ') | title), 'sns4': '',
                'headache': (states('sensor.headache_index') | float(0) | round | string),
                'shop1': shoplines[0] if shoplines | length > 0 else '',
                'shop2': shoplines[1] if shoplines | length > 1 else ''} }}
          b4: >-
            {{ {'shop3': shoplines[2] if shoplines | length > 2 else '',
                'shop4': shoplines[3] if shoplines | length > 3 else '',
                'shop5': shoplines[4] if shoplines | length > 4 else '',
                'shop6': shoplines[5] if shoplines | length > 5 else ''} }}
          b5: >-
            {{ {'cal1': callines[0] if callines | length > 0 else '',
                'cal2': callines[1] if callines | length > 1 else '',
                'cal3': callines[2] if callines | length > 2 else '',
                'cal4': callines[3] if callines | length > 3 else ''} }}
      - {action: mqtt.publish, data: {topic: zigbee2mqtt/ESPINK/set, payload: "{{ b1 | to_json }}"}}
      - {delay: {milliseconds: 900}}
      - {action: mqtt.publish, data: {topic: zigbee2mqtt/ESPINK/set, payload: "{{ b2 | to_json }}"}}
      - {delay: {milliseconds: 900}}
      - {action: mqtt.publish, data: {topic: zigbee2mqtt/ESPINK/set, payload: "{{ b3 | to_json }}"}}
      - {delay: {milliseconds: 900}}
      - {action: mqtt.publish, data: {topic: zigbee2mqtt/ESPINK/set, payload: "{{ b4 | to_json }}"}}
      - {delay: {milliseconds: 900}}
      - {action: mqtt.publish, data: {topic: zigbee2mqtt/ESPINK/set, payload: "{{ b5 | to_json }}"}}
